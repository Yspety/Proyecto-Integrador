server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router maneja las rutas del lado del cliente. Sin este fallback,
    # entrar directo a /admin/productos o recargar la página da 404: nginx busca
    # un archivo con ese nombre y no existe.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, así que su contenido nunca cambia.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
