spring.application.name=Proyecto_Integrador

# ─── Datasource (MySQL local) ────────────────────────────────────────────────
# createDatabaseIfNotExist evita tener que crear el schema a mano la primera vez.
spring.datasource.url=jdbc:mysql://localhost:3306/krypton?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# update: Hibernate crea/actualiza las tablas. No hay script SQL en el repo.
spring.jpa.hibernate.ddl-auto=update
# open-in-view=false a propósito: los services ya marcan @Transactional donde
# tocan colecciones LAZY (ver ProductoMapper.toResponseWithImages). Dejarlo en
# true taparía ese diseño y escondería LazyInitializationException reales.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
# HS256 exige una clave de 256 bits: mínimo 32 caracteres. En prod, override por env.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
# 24 h en milisegundos.
app.jwt.expiration=86400000

# ─── Uploads ─────────────────────────────────────────────────────────────────
app.uploads.dir=${UPLOADS_DIR:./uploads}
app.uploads.base-url=${UPLOADS_BASE_URL:http://localhost:8080}
# ImagenProductoServiceImpl valida 5 MB por archivo; el default de Spring es 1 MB
# y cortaría la request antes de llegar a esa validación.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── CORS ────────────────────────────────────────────────────────────────────
# Origen del dev server de Vite.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ─── Inventario ──────────────────────────────────────────────────────────────
# Punto de reposición por defecto para productos nuevos que no lo especifican.
# Cada producto puede tener el suyo: lo que tarda en reponerse no es igual para todos.
app.inventory.default-stock-min=${DEFAULT_STOCK_MIN:5}

# ─── Seed del primer ADMIN ───────────────────────────────────────────────────
# Sólo actúa si la base no tiene NINGÚN admin activo (ver AdminSeeder).
# Rompe el huevo-gallina: el registro público crea CLIENTE y /api/admin/users
# exige ROLE_ADMIN, así que sin esto el panel es inalcanzable.
# Apagalo con app.seed.admin.enabled=false cuando tengas tu admin real.
app.seed.admin.enabled=${ADMIN_SEED_ENABLED:true}
app.seed.admin.email=${ADMIN_EMAIL:admin@krypton.pe}
app.seed.admin.name=${ADMIN_NAME:Administrador}
app.seed.admin.password=${ADMIN_PASSWORD:Krypton.Admin.2026}
